name: Measure Drive upload throughput
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  benchmark:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install -r requirements.txt
      - name: Compare chunks and delete private test files
        env:
          GOOGLE_TOKEN_B64: ${{ secrets.GOOGLE_TOKEN_B64 }}
          RESULT_PATH: ${{ runner.temp }}/drive-benchmark.json
        run: python -u scripts/benchmark_drive.py
      - uses: actions/upload-artifact@v4
        with:
          name: drive-benchmark
          path: ${{ runner.temp }}/drive-benchmark.json
          retention-days: 2
