name: Optimize Internet Archive multipart upload
on:
  workflow_dispatch:
    inputs:
      workers:
        type: string
        default: '4,8'
      part_mib:
        type: string
        default: '32'
permissions:
  contents: read
concurrency:
  group: internet-archive-benchmark
  cancel-in-progress: false
jobs:
  benchmark:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install -r requirements.txt
      - name: Compare streams, verify a 2 GiB repeat when sustained speed is promising
        env:
          IA_ACCESS_KEY: ${{ secrets.IA_ACCESS_KEY }}
          IA_SECRET_KEY: ${{ secrets.IA_SECRET_KEY }}
          BENCHMARK_WORKERS: ${{ inputs.workers }}
          BENCHMARK_PART_MIB: ${{ inputs.part_mib }}
          RESULT_PATH: ${{ runner.temp }}/archive-parallel.json
        run: python -u scripts/benchmark_archive_parallel.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: internet-archive-parallel
          path: ${{ runner.temp }}/archive-parallel.json
          retention-days: 2
