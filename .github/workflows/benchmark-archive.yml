name: Measure Internet Archive upload throughput
on:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: internet-archive-benchmark
  cancel-in-progress: false
jobs:
  benchmark:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install -r requirements.txt
      - name: Compare private Drive and public Archive sandbox uploads
        env:
          IA_ACCESS_KEY: ${{ secrets.IA_ACCESS_KEY }}
          IA_SECRET_KEY: ${{ secrets.IA_SECRET_KEY }}
          GOOGLE_TOKEN_B64: ${{ secrets.GOOGLE_TOKEN_B64 }}
          RESULT_PATH: ${{ runner.temp }}/archive-benchmark.json
        run: python -u scripts/benchmark_archive.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: internet-archive-benchmark
          path: ${{ runner.temp }}/archive-benchmark.json
          retention-days: 2
