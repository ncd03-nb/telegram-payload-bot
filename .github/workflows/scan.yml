name: Scan payload metadata
run-name: scan-${{ inputs.job_id }}
on:
  workflow_dispatch:
    inputs:
      job_id:
        required: true
        type: string
      job_payload:
        required: true
        type: string
permissions:
  contents: read
concurrency:
  group: payload-scan-${{ inputs.job_id }}
  cancel-in-progress: false
jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -r requirements.txt
      - name: Read bounded ROM metadata
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          PUBLIC_BOT: 'true'
          ALLOW_GROUPS: 'true'
          ALLOWED_USER_IDS: ${{ secrets.ALLOWED_USER_IDS }}
          JOB_ID: ${{ inputs.job_id }}
          JOB_PAYLOAD: ${{ inputs.job_payload }}
          DATA_DIR: ${{ runner.temp }}/scan-data
          RESULT_PATH: ${{ runner.temp }}/scan-result/result.json
        run: python -m app.scan_runner
      - name: Store encrypted metadata
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: result-${{ inputs.job_id }}
          path: ${{ runner.temp }}/scan-result/result.json
          retention-days: 2
          if-no-files-found: ignore
      - name: Return metadata to Cloudflare
        if: always()
        env:
          HUB_URL: ${{ vars.HUB_URL }}
          HUB_BOT_ID: payload
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          JOB_ID: ${{ inputs.job_id }}
          RESULT_PATH: ${{ runner.temp }}/scan-result/result.json
        run: python scripts/notify_controller.py
